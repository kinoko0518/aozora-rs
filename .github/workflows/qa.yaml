name: QA and Profiling

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  qa:
    name: Run QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
        with:
          use-flake-hub: false

      - name: Clone Aozora Bunko Text Repository
        run: |
          mkdir -p applications/qa/assets
          git clone --depth 1 https://github.com/aozorahack/aozorabunko_text.git applications/qa/assets/aozorabunko_text

      - name: Run Full QA Analysis
        run: nix develop --command cargo run --bin qa --release

      - name: Upload QA result
        uses: actions/upload-artifact@v4
        with:
          name: qa-result
          path: applications/qa/out/result/
