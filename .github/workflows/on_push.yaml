name: CI and Pages Deploy

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # テストおよびEPUBCheckの実行 (Nix駆動)
  test-and-epubcheck:
    name: Test and EPUBCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run workspace tests
        run: nix develop --command cargo test --workspace

      - name: Build ayame CLI
        run: nix develop --command cargo build -p ayame-cli --release

      - name: Generate and Validate EPUBs
        run: |
          mkdir -p /tmp/works /tmp/epubs
          curl -sL -o /tmp/works/rashomon.zip https://www.aozora.gr.jp/cards/000879/files/127_ruby_150.zip
          curl -sL -o /tmp/works/melos.zip https://www.aozora.gr.jp/cards/000035/files/1567_ruby_4948.zip
          curl -sL -o /tmp/works/botchan.zip https://www.aozora.gr.jp/cards/000148/files/752_ruby_2438.zip
          curl -sL -o /tmp/works/kokoro.zip https://www.aozora.gr.jp/cards/000148/files/773_ruby_5968.zip
          curl -sL -o /tmp/works/tokyo_fuzoku.zip https://www.aozora.gr.jp/cards/001312/files/47728_ruby_33978.zip
          ./target/release/ayame epub --output /tmp/epubs /tmp/works/*.zip
          nix develop --command bash -c '
            for epub in /tmp/epubs/*.epub; do
              echo "Checking: $(basename "$epub")"
              epubcheck "$epub"
            done
          '

  # QAを実行 (Nix駆動)
  qa:
    name: Run QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run QA
        run: nix develop --command cargo run --bin qa --release

      - name: Upload QA result
        uses: actions/upload-artifact@v4
        with:
          name: qa-result
          path: applications/qa/out/result/

  # ayame-demo用のWASMビルド (Nix駆動)
  build-demo:
    name: Build ayame-demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build WASM for demo
        run: nix run .#update-demo-wasm

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: ./applications/demopage/

  # ayame-demoをデプロイ
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-demo, test-and-epubcheck]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download demo site
        uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: ./pages-deploy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages-deploy"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
